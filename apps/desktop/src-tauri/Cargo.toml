[package]
name = "nexusquant-desktop"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[lib]
name = "nexusquant_desktop"
path = "src/lib.rs"

[[bin]]
name = "nexusquant-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.0.0-rc" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
protocol-schema = { path = "../../../packages/protocol-schema" }
math-ta = { path = "../../../packages/math-ta" }

[build-dependencies]
tauri-build = "2.0.0-rc"
