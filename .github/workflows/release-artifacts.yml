name: Multi-Platform Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-artifacts:
    name: Build & Release Artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os: windows-latest
            arch: x86_64
          - platform: macos-latest
            os: macos-latest
            arch: universal
          - platform: ubuntu-22.04
            os: ubuntu-22.04
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '9'

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf

      - name: Install Python Package Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cx_Freeze pandas numpy duckdb pytest-asyncio

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Compile Rust FFI Dependencies
        run: cargo build --release --manifest-path packages/math-ta/Cargo.toml

      - name: Build Frontend Assets
        run: pnpm --filter @nexusquant/desktop-frontend build

      - name: Bundle Embedded Python Dependencies
        shell: bash
        run: |
          echo "Bundling embedded Python dependencies with PyInstaller..."
          pyinstaller --clean -y --onedir apps/desktop/engine/embedded_server.py
          # Place the bundled python engine into Tauri-accessible resource directory
          mkdir -p apps/desktop/src-tauri/resources/engine
          cp -r dist/embedded_server/* apps/desktop/src-tauri/resources/engine/ || cp -r build/embedded_server/* apps/desktop/src-tauri/resources/engine/ || true

      - name: Build Tauri Universal Binary (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile --prefix apps/desktop/frontend
          pnpm exec tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri Standard Binary (Windows/Linux)
        if: matrix.platform != 'macos-latest'
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile --prefix apps/desktop/frontend
          pnpm exec tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate and Stage Build Artifacts
        shell: bash
        run: |
          mkdir -p release_artifacts/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi release_artifacts/ || true
            cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe release_artifacts/ || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg release_artifacts/ || true
            cp -r apps/desktop/src-tauri/target/release/bundle/macos/*.app release_artifacts/ || true
          elif [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage release_artifacts/ || true
            cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb release_artifacts/ || true
          fi

      - name: Publish Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: release_artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
